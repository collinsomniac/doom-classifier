name: exp-doom-learning

on:
  push:
    branches:
      - "exp/replay-support-gate"
    paths:
      - "src/core/policy.js"
      - "src/doom-main.js"
      - "tests/doom-learning.spec.mjs"
      - ".github/workflows/exp-doom-learning.yml"

env:
  DOOM_RUNTIME_MODE: owned
  DOOM_TRAIN_STEPS: "256"
  DOOM_ROLLOUT_HORIZON: "64"

permissions:
  contents: read

concurrency:
  group: exp-doom-learning
  cancel-in-progress: true

jobs:
  chromium-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium test tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install chromium
      - name: Start static server
        run: python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/exp-doom-learning-http.log 2>&1 &
      - name: Run semantic-anchor fine-tune benchmark
        run: npx playwright test tests/doom-learning.spec.mjs --reporter=line
