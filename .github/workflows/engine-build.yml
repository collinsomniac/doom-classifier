name: owned-doom-engine

on:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/engine-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owned-doom-engine
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.14
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.14

      - name: Build owned Chocolate Doom telemetry runtime
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version
          bash engine/scripts/build_owned_wasm.sh

      - name: Validate generated runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s engine/dist/chocolate-doom.js
          test -s engine/dist/chocolate-doom.wasm
          test -s engine/dist/chocolate-doom.data
          test -s engine/dist/SOURCE.txt
          test -s engine/dist/telemetry.patch
          grep -q "player_damage_dealt" .engine-work/upstream/vendor/chocolate-doom/src/doom/browser_doom_bridge.c
          grep -q "PromptFPS_RecordPlayerDamage" .engine-work/upstream/vendor/chocolate-doom/src/doom/p_inter.c
          grep -q "PromptFPS_RecordLevelComplete" .engine-work/upstream/vendor/chocolate-doom/src/doom/g_game.c
          grep -q "PromptFPS_RecordPlayerDamage" engine/dist/telemetry.patch
          ls -lh engine/dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium ABI test tooling
        shell: bash
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install chromium

      - name: Boot owned runtime and verify causal event ABI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/owned-engine-http.log 2>&1 &
          npx playwright test tests/owned-engine.spec.mjs --reporter=line

      - name: Upload owned engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: doom-classifier-owned-engine
          path: engine/dist/
          if-no-files-found: error
          retention-days: 14
