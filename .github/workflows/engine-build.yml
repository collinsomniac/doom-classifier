name: owned-doom-engine

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "src/env/doom-wasm.js"
      - "tests/owned-engine.spec.mjs"
      - ".github/workflows/engine-build.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: owned-doom-engine
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate telemetry instrumentation script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile engine/scripts/instrument_engine.py
          bash -n engine/scripts/build_owned_wasm.sh

      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.14
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.14

      - name: Build owned Chocolate Doom telemetry runtime
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version
          bash engine/scripts/build_owned_wasm.sh

      - name: Validate generated runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s engine/dist/chocolate-doom.js
          test -s engine/dist/chocolate-doom.wasm
          test -s engine/dist/chocolate-doom.data
          test -s engine/dist/SOURCE.txt
          test -s engine/dist/telemetry.patch
          grep -q "player_damage_dealt" .engine-work/upstream/vendor/chocolate-doom/src/doom/browser_doom_bridge.c
          grep -q "PromptFPS_RecordPlayerDamage" .engine-work/upstream/vendor/chocolate-doom/src/doom/p_inter.c
          grep -q "PromptFPS_RecordLevelComplete" .engine-work/upstream/vendor/chocolate-doom/src/doom/g_game.c
          grep -q "D_PromptFPSStepTics" .engine-work/upstream/vendor/chocolate-doom/src/d_loop.c
          grep -q "D_PromptFPSSaveLoopState" .engine-work/upstream/vendor/chocolate-doom/src/d_loop.c
          grep -q "D_PromptFPSRestoreLoopState" .engine-work/upstream/vendor/chocolate-doom/src/d_loop.c
          grep -q "promptfps_snapshot_sector_soundtraversed" .engine-work/upstream/vendor/chocolate-doom/src/doom/g_game.c
          grep -q "promptfps_snapshot_line_validcount" .engine-work/upstream/vendor/chocolate-doom/src/doom/g_game.c
          grep -q "promptfps_snapshot_validcount" .engine-work/upstream/vendor/chocolate-doom/src/doom/g_game.c
          grep -q "promptfps_snapshot_sector_thinglist_index" .engine-work/upstream/vendor/chocolate-doom/src/doom/g_game.c
          grep -q "promptfps_snapshot_block_head_index" .engine-work/upstream/vendor/chocolate-doom/src/doom/g_game.c
          grep -q "promptfps_snapshot_snext_index" .engine-work/upstream/vendor/chocolate-doom/src/doom/g_game.c
          grep -q "promptfps_snapshot_bnext_index" .engine-work/upstream/vendor/chocolate-doom/src/doom/g_game.c
          grep -q "PromptFPS_CheckSightPure" .engine-work/upstream/vendor/chocolate-doom/src/doom/browser_doom_bridge.c
          grep -q "PromptFPS_StepTics" .engine-work/upstream/vendor/chocolate-doom/src/doom/browser_doom_bridge.c
          grep -q "PromptFPS_RecordPlayerDamage" engine/dist/telemetry.patch
          ls -lh engine/dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium ABI test tooling
        shell: bash
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install chromium

      - name: Boot owned runtime and verify causal event ABI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/owned-engine-http.log 2>&1 &
          npx playwright test tests/owned-engine.spec.mjs --reporter=line

      - name: Upload owned engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: doom-classifier-owned-engine
          path: engine/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish validated runtime snapshot
        id: publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SNAPSHOT="$RUNNER_TEMP/engine-runtime"
          rm -rf "$SNAPSHOT"
          mkdir -p "$SNAPSHOT"
          cp -a engine/dist/. "$SNAPSHOT/"
          cd "$SNAPSHOT"
          git init
          git checkout --orphan engine-runtime
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "engine runtime from ${GITHUB_SHA}"
          RUNTIME_SHA="$(git rev-parse HEAD)"
          echo "asset_sha=${RUNTIME_SHA}" >> "$GITHUB_OUTPUT"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:engine-runtime

      - name: Publish exact runtime pointer on main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_SHA: ${{ steps.publish.outputs.asset_sha }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B runtime-pointer origin/main
          mkdir -p runtime
          cat > runtime/engine-runtime.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "engine-runtime",
            "asset_commit": "${RUNTIME_SHA}",
            "source_commit": "${GITHUB_SHA}"
          }
          EOF
          git add runtime/engine-runtime.json
          if git diff --cached --quiet; then
            echo "Runtime pointer already current."
            exit 0
          fi
          git commit -m "runtime: pin owned engine ${RUNTIME_SHA:0:8}"
          git pull --rebase origin main
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

          for workflow in snapshot-regression.yml browser-smoke.yml causal-combat-model.yml; do
            echo "Dispatching ${workflow} against exact runtime ${RUNTIME_SHA}"
            curl --fail-with-body --silent --show-error -L               -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${GITHUB_TOKEN}"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches"               -d '{"ref":"main"}'
          done
