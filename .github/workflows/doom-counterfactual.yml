name: doom-counterfactual-benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/core/counterfactual.js"
      - "src/env/doom-wasm.js"
      - "tests/doom-counterfactual.spec.mjs"
      - ".github/workflows/doom-counterfactual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doom-counterfactual-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/cf-http.log 2>&1 &
      - name: Benchmark exact same-state action horizons
        run: npx playwright test tests/doom-counterfactual.spec.mjs --reporter=line
