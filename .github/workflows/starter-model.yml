name: starter-model

on:
  push:
    branches: [main]
    paths:
      - "tests/build-starter.spec.mjs"
      - "src/core/policy.js"
      - "src/core/neural-set-residual.js"
      - "src/core/controller.js"
      - "src/model-adapters/transformers-nli.js"
      - "src/model-adapters/schema-embedding-compiler.js"
      - "src/env/doom-wasm.js"
      - "src/doom-main.js"
      - ".github/workflows/starter-model.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starter-model
  cancel-in-progress: true

jobs:
  build-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install chromium

      - name: Start static server
        run: python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/starter-http.log 2>&1 &

      - name: Train, quality-gate, and round-trip starter
        env:
          STARTER_OUTPUT: artifacts/doom-starter.json
        run: npx playwright test tests/build-starter.spec.mjs --reporter=line

      - name: Validate checkpoint artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/doom-starter.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("artifacts/doom-starter.json","utf8"));if(x.format!=="doom-classifier-policy"||x.version!==1||!x.q?.params||!x.build?.selection)process.exit(1);console.log({params:x.q.params,selectedStage:x.build.selectedStage,trainingDecisions:x.build.trainingDecisions,bytes:fs.statSync("artifacts/doom-starter.json").size})'
          cat > artifacts/metadata.json <<EOF
          {
            "source_commit": "${GITHUB_SHA}",
            "workflow_run": "${GITHUB_RUN_ID}",
            "runtime_branch": "engine-runtime",
            "quality_gate": "best staged checkpoint among semantic baseline + four 64-decision causal fine-tune stages; 24-step teacher-free gate requires kills >= baseline, return >= 70% baseline, attributed damage >= 60% baseline; exact policy-output round trip",
            "teacher": "MobileBERT-MNLI with null-state label-bias calibration"
          }
          EOF

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: doom-classifier-starter
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish validated model snapshot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SNAPSHOT="$RUNNER_TEMP/model-runtime"
          rm -rf "$SNAPSHOT"
          mkdir -p "$SNAPSHOT"
          cp artifacts/doom-starter.json artifacts/metadata.json "$SNAPSHOT/"
          cd "$SNAPSHOT"
          git init
          git checkout --orphan model-runtime
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "starter model from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:model-runtime
