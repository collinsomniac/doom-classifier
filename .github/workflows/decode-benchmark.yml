name: decode-benchmark

on:
  push:
    branches: [main]
    paths:
      - tests/doom-decode-benchmark.spec.mjs
      - .github/workflows/decode-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decode-benchmark
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install chromium
      - name: Start static server
        run: python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/decode-http.log 2>&1 &
      - name: Compare frozen decode modes
        run: npx playwright test tests/doom-decode-benchmark.spec.mjs --reporter=line
