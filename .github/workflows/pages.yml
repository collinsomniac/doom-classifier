name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check JavaScript
        run: find src tests -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: Run deterministic smoke test
        run: node tests/smoke.mjs
      - name: Run DOOM adapter test
        run: node tests/doom-adapter.mjs
      - name: Run neural set invariants
        run: node tests/neural-set.mjs
      - name: Run neural temporal invariants
        run: node tests/neural-temporal.mjs
      - name: Run epistemic ensemble invariants
        run: node tests/epistemic-ensemble.mjs
      - name: Run action-conditioned attention invariants
        run: node tests/action-attention.mjs
      - name: Benchmark neural set fast path
        run: node tests/neural-set-benchmark.mjs
      - name: Run adaptive teacher invariants
        run: node tests/adaptive-teacher.mjs
      - name: Run semantic teacher replay invariants
        run: node tests/teacher-replay.mjs
      - name: Run policy exploration invariants
        run: node tests/policy-exploration.mjs
      - name: Run experience replay invariants
        run: node tests/experience-replay.mjs
      - name: Run n-step return invariants
        run: node tests/n-step-returns.mjs
      - name: Run target network invariants
        run: node tests/target-network.mjs
      - name: Run semantic/value separation invariants
        run: node tests/semantic-value-separation.mjs
      - name: Run portable policy checkpoint round-trip
        run: node tests/checkpoint-roundtrip.mjs
      - name: Run prior/value fusion invariants
        run: node tests/prior-value-fusion.mjs
      - name: Run temperature calibration invariants
        run: node tests/temperature-calibration.mjs
      - name: Run semantic collection summary
        run: node tests/nli-state-summary.mjs
      - name: Run independent NLI score invariants
        run: node tests/nli-independent-scores.mjs
      - name: Run schema transfer invariants
        run: node tests/schema-transfer.mjs
      - name: Run task-agnostic adapter contract
        run: node tests/task-adapter-contract.mjs
      - name: Run cross-task core reconfiguration
        run: node tests/cross-task-reconfigure.mjs
      - name: Run typed-action factorization invariants
        run: node tests/action-factorization.mjs
      - name: Run compiled semantic vector invariants
        run: node tests/semantic-vectors.mjs
      - name: Run categorical semantic invariants
        run: node tests/categorical-semantics.mjs
      - name: Benchmark action cardinality
        run: node tests/action-cardinality.mjs
      - name: Run adaptation benchmark
        run: node tests/benchmark.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled yet; validation succeeded and deployment is being skipped."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: steps.pages.outputs.enabled == 'true'
        name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
