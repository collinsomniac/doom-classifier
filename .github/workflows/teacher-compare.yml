name: teacher-comparison

on:
  push:
    branches: [main]
    paths:
      - tests/teacher-compare.spec.mjs
      - src/model-adapters/transformers-nli.js
      - src/core/policy.js
      - src/core/neural-set-residual.js
      - src/doom-main.js
      - .github/workflows/teacher-compare.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teacher-comparison
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium test tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install chromium
      - name: Start static server
        run: python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/teacher-compare-http.log 2>&1 &
      - name: Compare semantic teachers
        run: npx playwright test tests/teacher-compare.spec.mjs --reporter=line
