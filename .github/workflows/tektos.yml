name: tektos

# CI for the successor project. It gates on what is verified today and reports
# what is not: the encoder-weight gradients are printed but not asserted until
# docs/known-issues.md item 1 is resolved.

on:
  pull_request:
    paths:
      - "tektos/**"
      - ".github/workflows/tektos.yml"
  push:
    branches:
      - "feat/tektos**"

permissions:
  contents: read

concurrency:
  group: tektos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        working-directory: tektos
        run: find src tests tools -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: Core invariants
        working-directory: tektos
        run: node tests/core-invariants.mjs
      - name: Gradient check (verified groups asserted, remainder reported)
        working-directory: tektos
        run: node tests/gradient-check.mjs
      - name: Optimizer stability
        working-directory: tektos
        run: node tools/diagnose-learning.mjs
      - name: Grounding gate (expected to fail until known-issues item 1 is fixed)
        working-directory: tektos
        continue-on-error: true
        run: node tests/grounding.mjs
