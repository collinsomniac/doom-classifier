name: browser-smoke

on:
  push:
    branches: [main]
    paths:
      - doom.html
      - src/doom-main.js
      - src/env/doom-wasm.js
      - src/core/**
      - src/model-adapters/**
      - tests/doom-browser.spec.mjs
      - .github/workflows/browser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/doom-classifier-http.log 2>&1 &
          echo $! > /tmp/doom-classifier-http.pid
      - name: Boot real DOOM in Chromium
        run: npx playwright test tests/doom-browser.spec.mjs --reporter=line
