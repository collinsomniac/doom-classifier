name: doom-learning-benchmark

on:
  push:
    paths:
      - tests/doom-learning.spec.mjs
      - .github/workflows/doom-learning.yml
  workflow_dispatch:
    inputs:
      runtime:
        description: "DOOM runtime to benchmark"
        required: false
        type: choice
        default: owned
        options:
          - owned
          - borrowed
      steps:
        description: "Training decisions"
        required: false
        type: choice
        default: "256"
        options:
          - "64"
          - "128"
          - "256"
      rollout_horizon:
        description: "Reset environment after this many training decisions"
        required: false
        type: choice
        default: "64"
        options:
          - "0"
          - "32"
          - "64"
          - "128"

env:
  DOOM_RUNTIME_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime || 'owned' }}
  DOOM_TRAIN_STEPS: ${{ github.event_name == 'workflow_dispatch' && inputs.steps || '256' }}
  DOOM_ROLLOUT_HORIZON: ${{ github.event_name == 'workflow_dispatch' && inputs.rollout_horizon || '64' }}

permissions:
  contents: read

jobs:
  chromium-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium test tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install chromium
      - name: Start static server
        run: python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/doom-learning-http.log 2>&1 &
      - name: Run prepared fine-tune benchmark
        run: npx playwright test tests/doom-learning.spec.mjs --reporter=line
