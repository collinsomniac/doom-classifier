name: deberta-probe

on:
  push:
    paths:
      - tests/deberta-probe.spec.mjs
      - .github/workflows/deberta-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium test tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install chromium
      - name: Start static server
        run: python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/deberta-http.log 2>&1 &
      - name: Probe DeBERTa teacher
        run: npx playwright test tests/deberta-probe.spec.mjs --reporter=line
